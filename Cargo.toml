[workspace]
resolver = "3"
members = ["crates/bolh-core", "crates/bolh-place", "crates/bolh-sign"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
# Интерфейс: версия закреплена точно, обновляется осознанно (раздел 2 спецификации).
gpui-kit = "=0.9.0"

# Отладочная информация только со строками — и для своего кода, без неё
# для библиотек: сборка заметно быстрее, а папка target в разы меньше.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
