[package]
name = "bolh-core"
description = "Ядро Bolh Place: пространства, формат файлов, история, корзина. Без интерфейса."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
minisign-verify = "0.3.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde"] }
# Границы букв: курсор и Backspace не режут эмодзи и буквы со значками.
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3.27.0"
